# tmux-sessionizer config
# Symlinked to: ~/.config/tmux-sessionizer/tmux-sessionizer.conf

# Override default search paths.
# Add :N after a path to search N levels deep.
TS_SEARCH_PATHS=(
  ~/personal:1
  ~/work:1
  ~/avixa:1
  ~/.config:1
)

# Additional paths appended to TS_SEARCH_PATHS.
TS_EXTRA_SEARCH_PATHS=()

# Default depth for entries without a :N suffix.
TS_MAX_DEPTH=1

# Optional logging: unset/empty disables logs. Use "echo" or "file".
# TS_LOG=file
# TS_LOG_FILE="$HOME/.local/share/tmux-sessionizer/tmux-sessionizer.logs"

# Optional command sessions. Run with:
#   tmux-sessionizer -s 0
#   tmux-sessionizer -s 0 --vsplit
#   tmux-sessionizer -s 0 --hsplit
TS_SESSION_COMMANDS=(
  "$SHELL"
)
