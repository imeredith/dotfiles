# ~/.tmux.conf

# Prefix: default Ctrl-b.
set -g prefix C-b
bind C-b send-prefix

# Faster escape for vim/neovim.
set -sg escape-time 10

# Terminal/colors.
set -g default-terminal "tmux-256color"
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-overrides ",xterm-256color:RGB"
set -as terminal-overrides ",tmux-256color:RGB"

# Quality of life.
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
setw -g mode-keys vi

# Splits open in the current pane's directory.
bind r split-window -h -c "#{pane_current_path}"
bind d split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Reload config.
bind R source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Vim-style pane navigation.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# tmux-project-manager in a popup.
# Prefix + f, i.e. Ctrl-b f.
bind f display-popup -E -w 80% -h 95% "zsh -lc 'exec \"$(go env GOBIN)/tmux-project-manager\"'"

# Ctrl-f without prefix.
bind-key -n C-f display-popup -E -w 80% -h 95% "zsh -lc 'exec \"$(go env GOBIN)/tmux-project-manager\"'"

# Simple status line.
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=colour235,fg=colour250"
set -g window-status-current-style "bg=colour24,fg=colour255,bold"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g status-left " #[fg=colour81]#S #[default]"
set -g status-right " #[fg=colour245]%Y-%m-%d %H:%M "
